services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    restart: unless-stopped
    environment:
      # Публичный IP сервера или домен (клиенты будут подключаться по нему)
      - WG_HOST=${SERVER_IP}
      # Пароль для входа в веб-панель управления
      - PASSWORD=${ADMIN_PASSWORD}
      # Порт для подключения клиентов WireGuard
      - WG_PORT=51820
      # Порт веб-интерфейса внутри контейнера
      - WEBUI_PORT=51821
      # Подсеть для VPN клиентов (по умолчанию 10.8.0.x)
      - WG_DEFAULT_ADDRESS=10.8.0.x
      # DNS-серверы для клиентов (Cloudflare + Google для надежности)
      - WG_DEFAULT_DNS=1.1.1.1,8.8.8.8
      # MTU (1420 - стандарт для большинства мобильных и кабельных сетей)
      - WG_MTU=1420
      # KeepAlive для удержания NAT-сессий за сотовыми операторами
      - WG_PERSISTENT_KEEPALIVE=25
      # Отслеживание трафика клиентов
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
    volumes:
      - ./data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      # Веб-панель: доступна по порту 51821
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

